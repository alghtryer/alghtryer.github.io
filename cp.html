
<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Text Copy</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

.container {
    text-align: center;
    padding: 20px;
}

.image-box {
    position: relative;
    display: inline-block;
    max-width: 100%;
}

.image-box img {
    display: block;
    max-width: 100%;
    height: auto;
}

.image-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    color: white;
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    text-shadow: 2px 2px 5px #000;
}

.copy-btn {
    margin-top: 15px;
    padding: 11px 28px;
    border: none;
    border-radius: 6px;
    background: #222;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

.copy-btn:hover {
    background: #444;
}

</style>
</head>

<body>

<div class="container">

    <div class="image-box">

        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhhwVgNaqnfzxZ3uO1zdEFfaxvJXg5c1oMkTRfr0og-WWj9hBRt4MXXZnE2M75PVrsSvfN0rCBWOxIXJAaYgEed75p8mK3cI3Pw9ADTgGRLVPpYM4eu1Y-kpi3BZTn6hT-U1m-evXPWqQ9Rx5hg4oENkFw9sP_ABUDcs2LqdFpjnkW7KjSDDUaAL-l56w/s1600/Gemini_Generated_Image_yleseiyleseiyles.jpg" alt="Slika">

        <div class="image-text" id="copyText">
            Ovdje ide vaš tekst
        </div>

    </div>

    <br>

    <button class="copy-btn" onclick="copyText()">
        Copy
    </button>

</div>

<script>
function copyText() {
    const text = document.getElementById("copyText").innerText;

    navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector(".copy-btn");
        btn.innerText = "Copied!";
        
        setTimeout(() => {
            btn.innerText = "Copy";
        }, 1500);
    });
}
</script>

</body>
</html>
